<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBAC Classification System</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Segoe UI,Arial,sans-serif;
        }

        body{

            background:#000;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            overflow:hidden;

        }

        .container{

            text-align:center;

        }

        h1{

            color:#d4af37;
            font-size:55px;
            letter-spacing:2px;
            margin-bottom:15px;
            text-transform:uppercase;

        }

        p{

            color:#d0d0d0;
            font-size:18px;
            margin-bottom:60px;

        }

        .buttons{

            display:flex;
            justify-content:center;
            gap:30px;

        }

        .btn{

            text-decoration:none;
            color:#f5deb3;
            font-size:18px;
            font-weight:600;

            padding:15px 45px;

            border:1px solid rgba(212,175,55,0.5);

            border-radius:14px;

            background:rgba(212,175,55,0.15);

            backdrop-filter:blur(10px);

            -webkit-backdrop-filter:blur(10px);

            transition:.35s;

            box-shadow:
            0 8px 25px rgba(212,175,55,.15);

        }

        .btn:hover{

            background:rgba(212,175,55,.3);

            border-color:#d4af37;

            color:white;

            transform:translateY(-5px);

            box-shadow:
            0 15px 35px rgba(212,175,55,.35);

        }

        @media(max-width:600px){

            h1{

                font-size:35px;

            }

            .buttons{

                flex-direction:column;

                gap:20px;

            }

            .btn{

                width:230px;

                margin:auto;

            }

        }

    </style>

</head>

<body>

    <div class="container">

        <h1>RBAC Classification System</h1>

        <p>Secure Authentication & Complaint Classification Platform</p>

        <div class="buttons">

            <a href="/Login" class="btn">
                Login
            </a>

            <a href="/signup" class="btn">
                Sign Up
            </a>

        </div>

    </div>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Raise Complaint</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{

    min-height:100vh;

    background:url("/static/image.webp");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

}

body::before{

    content:"";

    position:fixed;
    inset:0;

    background:#000;

}

/*=========================
TOP BAR
==========================*/

.topbar{

    position:fixed;

    top:20px;
    left:20px;
    right:20px;

    height:70px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#000;

    backdrop-filter:blur(18px);

    border-radius:18px;

    border:1px solid rgba(212,175,55,.25);

    z-index:100;

}

.home{

    position:absolute;

    left:30px;

    color:#FFD700;

    font-size:28px;

}

.topbar h2{

    color:#FFD700;

    letter-spacing:1px;

}

/*=========================
FORM CONTAINER
==========================*/

.container{

    position:relative;

    width:700px;

    margin:130px auto;

    padding:40px;

    border-radius:20px;

    background:rgba(255,255,255,.08);

    backdrop-filter:blur(18px);

    border:1px solid rgba(212,175,55,.25);

    box-shadow:0 10px 35px rgba(0,0,0,.4);

}

.container h1{

    color:#FFD700;

    text-align:center;

    margin-bottom:35px;

}

/*=========================
FORM
==========================*/

.form-group{

    margin-bottom:25px;

}

label{

    display:block;

    color:white;

    margin-bottom:8px;

    font-weight:bold;

}

input[type=text],
textarea{

    width:100%;

    padding:15px;

    border:none;

    outline:none;

    border-radius:10px;

    background:rgba(255,255,255,.12);

    color:white;

    font-size:15px;

}

textarea{

    resize:none;

    height:170px;

}

input::placeholder,
textarea::placeholder{

    color:#d7d7d7;

}

/*=========================
FILE INPUT
==========================*/

input[type=file]{

    width:100%;

    padding:12px;

    color:white;

    background:rgba(255,255,255,.12);

    border-radius:10px;

}

/*=========================
BUTTON
==========================*/

button{

    width:100%;

    padding:16px;

    background:rgba(212,175,55,.18);

    color:#FFD700;

    border:1px solid rgba(212,175,55,.4);

    border-radius:12px;

    font-size:18px;

    cursor:pointer;

    transition:.3s;

}

button:hover{

    background:rgba(212,175,55,.35);

    transform:translateY(-3px);

}
.toast{

    position:fixed;

    top:110px;

    right:30px;

    background:rgba(20,120,20,.92);

    color:white;

    padding:15px 30px;

    border-radius:10px;

    font-size:16px;

    font-weight:bold;

    box-shadow:0 8px 20px rgba(0,0,0,.4);

    z-index:9999;

    animation:slideIn .4s ease,
              fadeOut .5s ease 2.5s forwards;

}

@keyframes slideIn{

    from{

        transform:translateX(100px);

        opacity:0;

    }

    to{

        transform:translateX(0);

        opacity:1;

    }

}

@keyframes fadeOut{

    to{

        opacity:0;

        visibility:hidden;

    }

}

</style>

</head>

<body>

<div class="topbar">

<a href="/citizen/dashboard">

<i class="fa-solid fa-house home"></i>

</a>

<h2>RULE-BASED COMPLAINT CLASSIFICATION SYSTEM</h2>

</div>


<div class="container">

<h1>Raise Complaint</h1>

<form action="/raise_complaint"
method="POST"
enctype="multipart/form-data">

<div class="form-group">

<label>Complaint Title</label>

<input
type="text"
name="title"
placeholder="Enter Complaint Title"
required>

</div>

<div class="form-group">

<label>Complaint Description</label>

<textarea
name="description"
placeholder="Describe your complaint in detail..."
required></textarea>

</div>

<div class="form-group">

<label>Location</label>

<input
type="text"
name="location"
placeholder="Enter Complaint Location"
required>

</div>

<div class="form-group">

<label>Upload Image (Optional)</label>

<input
type="file"
name="image"
accept="image/*">

</div>

<button type="submit">

<i class="fa-solid fa-paper-plane"></i>

&nbsp;

Submit Complaint

</button>

</form>

</div>

</body>
{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}

            <div class="toast">
                {{ message }}
            </div>

        {% endfor %}
    {% endif %}
{% endwith %}

</html>
